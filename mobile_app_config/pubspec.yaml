name: mobile_app_config
description: Agricultural E-commerce Mobile Application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.3.2

  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  connectivity_plus: ^7.0.0
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0-beta.5

  # Routing
  go_router: ^14.0.0
  gap: ^3.0.1

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  carousel_slider: ^5.1.1
  flutter_svg: ^2.0.9
  smooth_page_indicator: ^1.1.0
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Image Handling
  image_picker: ^1.0.7
  photo_view: ^0.15.0
  image_cropper: ^11.0.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.3.3
  logger: ^2.0.2+1
  url_launcher: ^6.2.4
  share_plus: ^12.0.1
  path_provider: ^2.1.2

  # Authentication
  google_sign_in: ^6.2.1

  # Functional Programming
  dartz: ^0.10.1

  # JSON
  json_annotation: ^4.8.1

  # Analytics & Monitoring
  firebase_core: ^4.2.1
  firebase_analytics: ^12.0.4
  firebase_crashlytics: ^5.0.5
  firebase_messaging: ^16.0.4

  # WebView
  webview_flutter: ^4.4.4

  # Permissions
  permission_handler: ^12.0.1

  # Device Info
  device_info_plus: ^12.3.0
  package_info_plus: ^8.3.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  bloc_test: ^10.0.0

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    # - assets/icons/
    # - assets/logos/
    - assets/fonts/

  # Fonts
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
